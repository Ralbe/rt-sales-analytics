server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    # DNS Docker: адреса контейнеров определяются при каждом запросе,
    # поэтому пересоздание web/api не ломает прокси (иначе — 502 до перезапуска nginx)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;
    set $web_upstream http://web:3000;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;

    # API и Swagger (/api/docs)
    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Метрики только для внутренней сети
    location /metrics {
        deny all;
    }

    location / {
        proxy_pass $web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
