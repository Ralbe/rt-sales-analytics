name: rt-analytics

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rt}:${POSTGRES_PASSWORD:-rt}@postgres:5432/${POSTGRES_DB:-rt}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-rt}:${RABBITMQ_PASSWORD:-rt}@rabbitmq:5672//
  SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rt}
      POSTGRES_DB: ${POSTGRES_DB:-rt}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rt}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rt}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  api:
    build: ./backend
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "1"
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-1}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      retries: 10

  worker:
    build: ./backend
    command: ["celery", "-A", "app.worker", "worker", "--loglevel=info", "--concurrency=2"]
    environment: *backend-env
    depends_on:
      api: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  beat:
    build: ./backend
    command: ["celery", "-A", "app.worker", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    environment: *backend-env
    depends_on:
      rabbitmq: { condition: service_healthy }

  web:
    build: ./frontend
    depends_on: [api]

  nginx:
    image: nginx:1.27-alpine
    ports: ["${HTTP_PORT:-8080}:80"]
    volumes: ["./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [web, api]

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [monitoring]
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.3.1
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["3001:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
